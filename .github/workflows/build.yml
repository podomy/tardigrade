name: build

# Builds the OSS binary the same way the Makefile documents: inside the
# period builder image (Go 1.12, node/yarn, cmake, gcc of the era), with
# the tree mounted at the GOPATH path the Makefile enforces.
on:
  push:
    branches: [tardigrade-main, release-19.2]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  buildoss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build OSS binary
        run: |
          # The builder image runs as our UID and needs a writable home
          # (Go build cache, yarn cache), mirroring build/builder.sh.
          mkdir -p build/builder_home/.cache build/builder_home/.yarn-cache
          docker run --rm \
            -v "${{ github.workspace }}:/go/src/github.com/podomy/tardigrade" \
            -v "${{ github.workspace }}/build/builder_home:/home/roach" \
            -w /go/src/github.com/podomy/tardigrade \
            -e GOPATH=/go \
            -u "$(id -u):$(id -g)" \
            cockroachdb/builder:20191029-105705 make buildoss

      - name: Inspect linkage
        run: ldd ./cockroachoss || true

      - name: Smoke test
        # Runs inside the builder image: it has the period libraries
        # (e.g. libncurses5) the binary links against.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/go/src/github.com/podomy/tardigrade" \
            -v "${{ github.workspace }}/build/builder_home:/home/roach" \
            -w /go/src/github.com/podomy/tardigrade \
            -e GOPATH=/go -e HOME=/home/roach \
            -u "$(id -u):$(id -g)" \
            cockroachdb/builder:20191029-105705 sh -c '
              ./cockroachoss version &&
              ./cockroachoss start-single-node --insecure --background --store=path=/tmp/cockroach-data &&
              ./cockroachoss sql --insecure --execute="CREATE DATABASE smoketest; CREATE TABLE smoketest.kv (k INT PRIMARY KEY, v STRING); INSERT INTO smoketest.kv VALUES (1, '"'"'tardigrade'"'"'); SELECT * FROM smoketest.kv;" &&
              ./cockroachoss quit --insecure'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tardigrade-oss
          path: cockroachoss

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/podomy/tardigrade
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Tardigrade
            org.opencontainers.image.description=Distributed SQL database (CP). AGPL-3.0 fork of CockroachDB 19.2.
            org.opencontainers.image.vendor=Podomy
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/podomy/tardigrade

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
