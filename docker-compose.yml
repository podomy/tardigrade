# Single-node Tardigrade for local development.
#
#   make buildoss && docker compose up --build
#
# SQL:  postgres://root@localhost:26257?sslmode=disable
# UI:   http://localhost:8080
services:
  tardigrade:
    # Published by the build workflow to ghcr.io (see .github/workflows).
    # To build locally instead, replace `image:` with `build: .`
    # (requires ./cockroachoss from `make buildoss` in the context).
    image: ghcr.io/podomy/tardigrade:latest
    command: ["start-single-node", "--insecure", "--advertise-addr=tardigrade"]
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - tardigrade-data:/cockroach/cockroach-data

volumes:
  tardigrade-data:
